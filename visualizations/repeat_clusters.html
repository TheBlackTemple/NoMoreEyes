<style>

  p { max-width: var(--code-width); }

<body>

<h2>Every independently repeated run, each pattern its own color (no master/reference row)</h2>
<p style="color:#888; margin-bottom:12px;">Font color = longest cluster covering that token. Underline = a shorter, nested cluster also covers it. Plain gray = unique, no repeat.</p>
<div class="legend" id="legend"></div>
<div id="blocks"></div>

"114", "231", "010", "144", "300", "204", "043", "244", "021", "023", "103", "101", "034", "143", "232", "212", "122", "220", "114", "103", "244", "020", "032", "112", "021", "033", "034", "133", "034", "311", "132", "004", "222", "014", "141", "144", "112", "201", "301", "213", "004", "133", "142", "032", "232", "304", "041", "112", "134", "031", "110", "122", "101", "103", "131", "233", "212", "114", "201", "020", "234", "240", "013", "011", "141", "133", "033", "124", "142", "133", "030", "023", "113", "110", "120", "222", "122", "000", "122", "010", "123", "210", "122", "023", "130", "100", "014", "041", "021", "224", "010", "304", "132", "233", "021", "241", "021", "143", "003", "232", "221", "130", "042", "024", "120", "200", "221", "124", "021", "002", "231", "144", "201", "203", "032", "243", "121", "300", "244", "204", "044", "110", "204", "240"], "East 4": ["102", "231", "010", "144", "300", "204", "002", "220", "104", "130", "002", "210", "014", "030", "214", "033", "233", "003", "121", "010", "142", "302", "134", "123", "001", "033", "103", "301", "004", "114", "220", "223", "213", "310", "032", "204", "304", "300", "143", "204", "210", "034", "222", "224", "024", "142", "201", "240", "300", "010", "021", "142", "140", "213", "233", "234", "304", "100", "123", "140", "243", "142", "233", "200", "114", "140", "303", "101", "304", "212", "004", "211", "042", "220", "033", "300", "133", "220", "214", "232", "223", "132", "144", "113", "130", "230", "304", "302", "012", "003", "101", "222", "111", "303", "101", "212", "234", "130", "004", "043", "101", "023", "232", "132", "123", "242", "021", "124", "230", "220", "100", "011", "310", "231", "233", "302", "214", "303", "034"], "West 4": ["302", "231", "010", "144", "300", "204", "002", "220", "104", "130", "002", "210", "014", "030", "214", "033", "233", "003", "121", "010", "142", "220", "041", "310", "001", "242", "210", "031", "312", "120", "212", "034", "001", "231", "033", "102", "124", "032", "244", "311", "124", "024", "303", "000", "100", "230", "133", "231", "224", "123", "311", "043", "044", "200", "212", "110", "241", "300", "101", "233", "204", "212", "211", "200", "241", "243", "024", "041", "013", "112", "101", "223", "010", "122", "034", "133", "231", "142", "203", "114", "231", "043", "243", "111", "204", "123", "302", "232", "021", "223", "304", "011", "042", "041", "201", "234", "244", "041", "010", "032", "232", "122", "104", "041", "220", "024", "312", "134", "110", "004", "040", "132", "120", "001", "111", "204", "141", "040", "130", "110"], "East 5": ["113", "231", "010", "144", "300", "204", "002", "220", "104", "130", "002", "210", "014", "030", "214", "033", "233", "003", "121", "010", "142", "113", "041", "214", "134", "033", "103", "301", "214", "114", "220", "223", "304", "102", "022", "204", "010", "144", "143", "204", "210", "202", "222", "242", "234", "020", "212", "042", "213", "143", "232", "203", "012", "114", "112", "110", "111", "034", "101", "013", "114", "141", "012", "110", "241", "210", "114", "300", "204", "014", "011", "220", "010", "043", "100", "140", "132", "310", "100", "022", "042", "301", "040", "201", "222", "041", "130", "014", "131", "020", "134", "243", "013", "113", "240", "243", "011", "111", "041", "242", "010", "130", "221", "201", "132", "231", "224", "244", "221", "100", "223", "132", "044", "131"]};
const clusters = [{"content": ["231", "010", "143", "222", "023", "300", "104", "044", "221", "132", "240", "231", "222", "112", "024", "311", "013", "030", "303", "002", "104", "023", "144", "001"], "occurrences": [["East 1", 1, 24], ["East 2", 1, 24], ["West 1", 1, 24]]}, {"content": ["231", "010", "144", "300", "204", "002", "220", "104", "130", "002", "210", "014", "030", "214", "033", "233", "003", "121", "010", "142"], "occurrences": [["East 4", 1, 20], ["East 5", 1, 20], ["West 4", 1, 20]]}, {"content": ["024", "041", "240", "142", "134", "143", "132", "034", "143", "023", "142", "034", "144"], "occurrences": [["East 1", 37, 13], ["West 1", 37, 13]]}, {"content": ["231", "010", "144", "300", "204", "002", "220", "104", "130"], "occurrences": [["East 3", 1, 9], ["East 4", 1, 9], ["East 5", 1, 9], ["West 4", 1, 9]]}, {"content": ["231", "010", "144", "300", "204"], "occurrences": [["East 3", 1, 5], ["East 4", 1, 5], ["East 5", 1, 5], ["West 2", 1, 5], ["West 3", 1, 5], ["West 4", 1, 5]]}, {"content": ["311", "041", "034", "000"], "occurrences": [["East 1", 29, 4], ["West 1", 29, 4]]}, {"content": ["033", "103", "301"], "occurrences": [["East 4", 25, 3], ["East 5", 25, 3]]}, {"content": ["114", "220", "223"], "occurrences": [["East 4", 29, 3], ["East 5", 29, 3]]}, {"content": ["143", "204", "210"], "occurrences": [["East 4", 38, 3], ["East 5", 38, 3]]}];
// font colors, readable directly on the dark page background
const colors = ['#4ade80','#f472b6','#60a5fa','#fbbf24','#a78bfa','#fb923c','#34d399','#f87171'];

// For each token, collect ALL clusters covering it (there can be several nested ones).
// Longest covering cluster -> background color. Second-longest (if any) -> font color.
// This makes nesting visible instead of hiding shorter clusters under longer ones.
const coverage = {}; // label -> array of arrays of {ci, len}
Object.keys(blocks).forEach(l => {
  coverage[l] = Array.from({length: blocks[l].length}, () => []);
});

clusters.forEach((cl, ci) => {
  cl.occurrences.forEach(([label, start, length]) => {
    for (let k = 0; k < length; k++) {
      coverage[label][start + k].push({ci, len: length});
    }
  });
});

const blockFg = {};
const blockUnderline = {};
Object.keys(blocks).forEach(l => {
  blockFg[l] = new Array(blocks[l].length).fill(null);
  blockUnderline[l] = new Array(blocks[l].length).fill(null);
  coverage[l].forEach((covers, i) => {
    if (covers.length === 0) return;
    // font color = the LONGEST cluster covering this token -- the outer span it belongs to
    const byLen = [...covers].sort((a,b) => b.len - a.len);
    blockFg[l][i] = colors[byLen[0].ci % colors.length];
    if (covers.length > 1) {
      // underline color = the SHORTEST (innermost) cluster covering this token
      const bySmallest = [...covers].sort((a,b) => a.len - b.len);
      blockUnderline[l][i] = colors[bySmallest[0].ci % colors.length];
    }
  });
});

// legend
const legend = document.getElementById('legend');
clusters.forEach((cl, ci) => {
  const color = colors[ci % colors.length];
  const div = document.createElement('div');
  div.className = 'item';
  div.innerHTML = `<span class="swatch" style="background:${color}"></span>len ${cl.content.length} ×${cl.occurrences.length}: ${cl.content.slice(0,4).join(' ')}${cl.content.length>4?' …':''}`;
  legend.appendChild(div);
});

// blocks, wrapped every 26 trigrams (original line length)
const WRAP = 26;
const container = document.getElementById('blocks');
Object.keys(blocks).forEach(label => {
  const toks = blocks[label];
  const blockDiv = document.createElement('div');
  blockDiv.className = 'block';
  const blockLbl = document.createElement('div');
  blockLbl.className = 'block-label';
  blockLbl.textContent = label;
  blockDiv.appendChild(blockLbl);

  for (let lineStart = 0; lineStart < toks.length; lineStart += WRAP) {
    const row = document.createElement('div');
    row.className = 'row';
    for (let i = lineStart; i < Math.min(lineStart + WRAP, toks.length); i++) {
      const span = document.createElement('span');
      span.className = 'tok';
      const fg = blockFg[label][i];
      const ul = blockUnderline[label][i];
      if (fg) {
        span.style.color = fg;
        span.style.fontWeight = 'bold';
        if (ul) {
          span.style.textDecoration = 'underline';
          span.style.textDecorationColor = ul;
          span.style.textDecorationThickness = '2px';
          span.style.textUnderlineOffset = '3px';
        }
      }
      span.textContent = toks[i];
      row.appendChild(span);
    }
    blockDiv.appendChild(row);
  }
  container.appendChild(blockDiv);
});
